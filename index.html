<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Website</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background-color: black;
      padding: 0;
      font-family: 'Sora', sans-serif;
      background-size: cover;
      background-position: center;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden; /* Prevent scrolling */
    }

    .container {
      display: flex;
      align-items: center;
      width: 90%; /* Cover most of the page width */
      max-width: 1200px; /* Limit maximum width */
      margin: 0 auto;
    }

    .ebook-cover {
      width: 30%; /* Adjust as needed */
      max-width: 400px; /* Limit maximum size */
      height: auto;
      margin-right: 5%; /* Space between image and text */
    }

    .content {
      flex: 1;
      text-align: left;
    }

    h1 {
      font-size: 5vw; /* Responsive font size based on viewport width */
      margin: 0 0 20px 0;
      color: white;
    }

    .download-button {
      background: linear-gradient(90deg, #1e90ff, #00bfff); /* Gradient blue */
      color: white;
      padding: 15px 30px;
      border: none;
      border-radius: 25px; /* Rounded corners */
      font-size: 2vw; /* Responsive font size */
      cursor: pointer;
      transition: background 0.3s ease;
      text-decoration: none; /* Remove underline from link */
      display: inline-block; /* Make the link behave like a button */
    }

    .download-button:hover {
      background: linear-gradient(90deg, #00bfff, #1e90ff); /* Reverse gradient on hover */
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        text-align: center;
      }

      .ebook-cover {
        width: 50%; /* Adjust for smaller screens */
        margin-right: 0;
        margin-bottom: 20px;
      }

      h1 {
        font-size: 8vw; /* Larger font size for smaller screens */
      }

      .download-button {
        font-size: 4vw; /* Larger button text for smaller screens */
      }
    }
  </style>
</head>
